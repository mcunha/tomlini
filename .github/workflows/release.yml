# Release workflow — triggered automatically on push to main, or manually.
#
# **Before first release:** remove `publish = false` from:
#   - crates/tomlini/Cargo.toml
#   - crates/tomlini_serde/Cargo.toml
#
# Then set `CARGO_REGISTRY_TOKEN` in repository secrets (crates.io API token).
#
# release-plz reads conventional commits since the last tag, computes the

name: Release

permissions: read-all  # zizmor: ignore[excessive-permissions]

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump (override auto-detection)'
        required: false
        type: choice
        options: ['', patch, minor, major]
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  release-plz:
    name: Release PR (release-plz)
    if: github.event_name == 'push'
    permissions:
      # release-plz needs write perms for PR creation and git tag
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release PR
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  manual-release:
    name: Manual release (cargo-release)
    if: github.event_name == 'workflow_dispatch'
    permissions:
      # cargo-release needs write perms for git tag push
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-release
        run: cargo install cargo-release --locked

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ -z "$BUMP" ]; then BUMP="patch"; fi
          cargo release "$BUMP" \
            --workspace \
            --no-publish \
            --no-push \
            --execute
          TAG="v$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "tomlini") | .version')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Push tag
        run: git push --follow-tags

      - name: Publish tomlini
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p tomlini

      - name: Publish tomlini_serde
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p tomlini_serde

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
