# Dependabot — automated dependency updates.
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group all updates into one PR per week to reduce noise.
    groups:
      cargo:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "automated"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
