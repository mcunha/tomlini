[workspace]
members = ["crates/tomlini", "crates/tomlini_serde", "crates/benchmarks"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/tomlini"
documentation = "https://docs.rs/tomlini"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
toml_datetime = "1"
toml_edit = "0.25"
toml = "1.1"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg()'] }