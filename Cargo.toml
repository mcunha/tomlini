[workspace]
members = ["crates/tomlini", "crates/tomlini_serde"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
toml_datetime = "1"
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg()'] }