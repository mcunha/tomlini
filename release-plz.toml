name = "toml_benchmarks"
publish = false

# Publish order — tomlini first (tomlini_serde depends on it).
# Set `publish = true` after removing `publish = false` from the Cargo.toml files.
[[package]]
name = "tomlini"
publish = false

[[package]]
name = "tomlini_serde"
publish = false
