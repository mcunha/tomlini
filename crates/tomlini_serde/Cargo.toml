[package]
name = "tomlini_serde"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Serde Deserializer powered by tomlini's flat-span parser"

[package.metadata.release]
release = false

[features]
default = ["std"]
std = ["tomlini/std", "toml_writer/std", "toml_datetime/std"]
alloc = ["tomlini/alloc", "toml_writer/alloc", "toml_datetime/alloc"]

[dependencies]
tomlini = { path = "../tomlini", default-features = false }
toml_datetime = { path = "../toml_datetime", features = ["serde"] }
serde = { version = "1", default-features = false, features = ["derive"] }
toml_writer = { path = "../toml_writer", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tomlini = { path = "../tomlini" }

[lints]
workspace = true
