[package]
name = "tomlini_serde"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Serde Deserializer powered by tomlini's flat-span parser"

[dependencies]
tomlini = { path = "../tomlini", default-features = false, features = ["alloc"] }
serde.workspace = true
toml_datetime = { workspace = true, features = ["serde"] }
[features]
default = ["std"]
std = ["alloc", "tomlini/std"]
alloc = ["tomlini/alloc"]
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tomlini = { path = "../tomlini" }

[lints]
workspace = true
